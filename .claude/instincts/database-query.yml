# 遵循数据库查询规范

## Action

### 必须做的
```php
// 指定具体字段
User::select(['id', 'name', 'email'])->get();

// 使用参数绑定
DB::select('SELECT * FROM users WHERE id = ?', [$id]);

// 使用查询构建器
$query->where('status', 1)->whereIn('id', $ids);

// 合理使用索引
$query->where('user_id', $userId)  // 索引字段
      ->where('created_at', '>=', $startDate);
```

### 禁止做的
```php
// 禁止 SELECT *
User::all();
User::get();

// 禁止字符串拼接 SQL
DB::select("SELECT * FROM users WHERE id = {$id}");

// 禁止过多 JOIN
$query->join('table1', ...)
      ->join('table2', ...)
      ->join('table3', ...)
      ->join('table4', ...);  // 超过3张表

// 禁止大偏移分页
$query->offset(10000)->limit(20);  // 使用基于ID的分页
```

## Rules
1. 必须指定查询字段，禁止 `SELECT *`
2. JOIN 关联表不超过3张
3. 单次查询返回不超过1000条
4. 分页使用基于ID的方式避免大偏移
5. 索引字段放在 WHERE 条件前面
